[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epubconv"
version = "0.1.0"
description = "EPUB Traditional/Simplified Chinese converter with pluggable engines"
readme = { content-type = "text/markdown", text = "EPUB trad/simp converter." }
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "loguru>=0.7",
    "chardet>=5.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
llm = [
    "openai>=1.30",
]

[project.scripts]
epubconv = "epubconv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/epubconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
